# .github/workflows/cd.yml
# Builds Docker images in CI, pushes to GHCR, then deploys to the VPS via SSH.
# No source code touches the server — only pre-built container images.
#
# Prerequisites (set as GitHub Actions secrets):
#   VPS_HOST      — server IP or hostname
#   VPS_USER      — SSH username (e.g., root)
#   VPS_SSH_KEY   — private SSH key for the VPS
#   VPS_PATH      — path to codearena directory on the VPS (default: /opt/codearena)

name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/codearena-api:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/codearena-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/codearena-web:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/codearena-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_OWNER
          script: |
            set -e
            cd "${VPS_PATH:-/opt/codearena}"

            echo "Pulling latest images..."
            docker compose pull

            echo "Recreating changed services..."
            docker compose up -d --remove-orphans

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete."
