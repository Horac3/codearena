version: '3.9'

# CodeArena — integration test services
# Usage: docker compose -f docker-compose.test.yml up -d
# Then:  cd apps/api && npx jest --config test/jest-e2e.config.ts

services:

  codearena-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: codearena_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearena -d codearena_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  codearena-test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
