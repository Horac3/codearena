version: '3.9'

# CodeArena — production VPS deployment
# nginx-proxy + acme-companion pattern. Services use expose + VIRTUAL_HOST.
# Resource limits are MANDATORY — they prevent any one container from
# starving the others on the 4GB / 2-core VPS.

services:

  # ── NestJS API + WebSocket duel gateway ──────────────────────────────────
  codearena-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file: .env
    environment:
      VIRTUAL_HOST: api.codearena.never9to5ive.com
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: api.codearena.never9to5ive.com
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      codearena-db:
        condition: service_healthy
      codearena-redis:
        condition: service_healthy
    volumes:
      - ./questions:/app/questions:ro
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 256M
    restart: unless-stopped
    networks:
      - nginx-proxy
      - codearena-internal

  # ── Static landing + invite page ─────────────────────────────────────────
  codearena-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: codearena.never9to5ive.com,www.codearena.never9to5ive.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: codearena.never9to5ive.com,www.codearena.never9to5ive.com
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    restart: unless-stopped
    networks:
      - nginx-proxy

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  codearena-db:
    image: postgres:16-alpine
    volumes:
      - codearena-db-data:/var/lib/postgresql/data
    env_file: .env
    environment:
      # Tune Postgres for 768MB allocation
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M
        reservations:
          cpus: '0.10'
          memory: 256M
    restart: unless-stopped
    networks:
      - codearena-internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  codearena-redis:
    image: redis:7-alpine
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --hz 20
        --activerehashing yes
    volumes:
      - codearena-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    restart: unless-stopped
    networks:
      - codearena-internal

  # ── Judge0 code execution engine ──────────────────────────────────────────
  # Judge0 runs as a separate Docker Compose stack on the same VPS.
  # It is connected to the codearena-internal network for API access.
  # See docs/deployment.md for Judge0 installation instructions.
  # The Judge0 worker container must be connected to codearena-internal:
  #   docker network connect codearena-internal judge0-worker-1

  # ── nginx WebSocket config ────────────────────────────────────────────────
  # Injects the Upgrade header config into nginx-proxy so WebSocket
  # connections survive through the proxy (required for duel mode).
  codearena-nginx-config:
    image: alpine:3.18
    volumes:
      - ./nginx/codearena.conf:/etc/nginx/conf.d/codearena.conf:ro
      - nginx-conf:/etc/nginx/conf.d
    command: >
      sh -c "cp /etc/nginx/conf.d/codearena.conf /etc/nginx/conf.d/ && echo 'nginx config injected'"
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M
    restart: "no"
    networks: []

volumes:
  codearena-db-data:
  codearena-redis-data:
  nginx-conf:

networks:
  nginx-proxy:
    external: true
  codearena-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
