# nginx/codearena.conf
# Injected into nginx-proxy to support WebSocket connections for duel mode.
# Without this, nginx kills idle WS connections after 60s, dropping active duels.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Keep WebSocket connections alive for the full duel duration
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;

# API-specific: reasonable timeout for HTTP requests
location /api {
    proxy_read_timeout 30s;
}
